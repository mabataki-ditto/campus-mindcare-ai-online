# ============================================================
# Nginx 配置文件 — 校园AI心理陪伴平台
# 作用：托管前端静态资源 + 反向代理后端 API
# 挂载方式：docker-compose.yml 中挂载到 /etc/nginx/conf.d/default.conf
# ============================================================

# 限流配置：限制每个 IP 每秒最多 10 个 API 请求，防止高并发刷接口
# $binary_remote_addr：用二进制格式的客户端 IP 作为限流 key（比字符串更省内存）
# zone=api_limit：命名限流区为 api_limit，后续 location 中引用
# 10m：分配 10MB 内存存储 IP 状态（约可记录 16 万个 IP）
# rate=10r/s：平均每秒允许 10 个请求
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;


server {
    # 监听 80 端口（HTTP 默认端口，浏览器访问域名时自动补 80）
    listen 80;
    # 匹配的域名，多个用空格分隔
    # 浏览器访问 http://mindcare.chat 或 http://www.mindcare.chat 都会命中此 server
    server_name mindcare.chat www.mindcare.chat;

    # 前端静态资源根目录
    # Vue 构建产物（dist）由 ai-vue/Dockerfile 在构建阶段复制到这里
    root /usr/share/nginx/html;
    # 默认首页文件
    index index.html;

    # ==================== 前端路由 ====================
    # Vue Router 使用 history 模式时，URL 没有 # 号
    # 刷新页面时浏览器会向服务器请求真实路径（如 /consultation）
    # 但服务器上只有 index.html，没有 /consultation 这个文件
    # try_files 依次尝试：
    #   1. $uri      — 精确匹配请求的文件（如 /css/app.css）
    #   2. $uri/     — 匹配请求的目录
    #   3. /index.html — 都找不到就返回 index.html，由前端路由接管
    # 这样刷新任何页面都不会 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ==================== index.html 禁止缓存 ====================
    # 前端构建后 JS/CSS 文件名带 hash，内容变了 hash 就变，可以长缓存
    # 但 index.html 必须每次都拉最新的，否则浏览器拿到旧的 index.html
    # 引用的还是旧 hash 的 JS/CSS，导致用户看不到更新（"实时显示"的关键）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ==================== 后端 API 反向代理 ====================
    # 所有 /api/ 开头的请求转发到后端容器
    # 后端 3000 端口不暴露公网，只能通过 Nginx 访问，提高安全性
    location /api/ {
        # 应用限流：zone=api_limit 引用上面定义的限流区
        # burst=20：允许突发 20 个请求排队（超过 rate 的部分）
        # nodelay：排队的请求立即处理，不延迟
        limit_req zone=api_limit burst=20 nodelay;

        # 反向代理到后端容器
        # backend 是 docker-compose 中后端服务的名称，Docker 内部 DNS 自动解析
        # 容器间通过 Docker 网络通信，无需知道后端真实 IP
        proxy_pass http://backend:3000/api/;

        # 使用 HTTP/1.1 协议（默认 1.0），支持长连接和 SSE 流式传输
        proxy_http_version 1.1;

        # 传递客户端真实信息给后端（否则后端只能看到 Nginx 的 IP）
        proxy_set_header Host $host;                    # 客户端请求的域名
        proxy_set_header X-Real-IP $remote_addr;        # 客户端真实 IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # 代理链路 IP
        proxy_set_header X-Forwarded-Proto $scheme;     # 原始协议（http/https）
    }

    # ==================== 上传文件代理 ====================
    # 用户上传的文件（头像、附件等）由后端 Express 静态服务返回
    # 不走 /api/ 是因为这些是静态文件，后端用 express.static 直接返回
    location /uploads/ {
        proxy_pass http://backend:3000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
