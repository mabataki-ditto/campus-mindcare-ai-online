# 统一编排前端、后端、数据库和入口 Nginx。
# 在本目录执行：docker compose up --build -d
services:
  mysql:
    image: mysql:8.4
    container_name: mindcare-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?copy .env.example to .env and set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?copy .env.example to .env and set MYSQL_DATABASE}
    volumes:
      # 数据库数据放到 Docker volume，避免容器删除后数据丢失。
      - mysql_data:/var/lib/mysql
    networks:
      - mindcare_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./ai-psychological-server
      dockerfile: Dockerfile
    container_name: mindcare-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_USER: root
      DATABASE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?copy .env.example to .env and set MYSQL_ROOT_PASSWORD}
      DATABASE_NAME: ${MYSQL_DATABASE:?copy .env.example to .env and set MYSQL_DATABASE}
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:?copy .env.example to .env and set MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE:?copy .env.example to .env and set MYSQL_DATABASE}
      JWT_SECRET: ${JWT_SECRET:?copy .env.example to .env and set JWT_SECRET}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      UPLOAD_DIR: uploads
    volumes:
      # 后端上传文件持久化保存。
      - backend_uploads:/app/uploads
    networks:
      - mindcare_net
    command: sh -c "npx prisma migrate deploy && node dist/index.js"

  nginx:
    build:
      context: ./ai-vue
      dockerfile: Dockerfile
    container_name: mindcare-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # 练习阶段用 8080；正式使用 HTTP 时可改成 "80:80"。
      - "8080:80"
    volumes:
      # 只覆盖 Nginx 配置，前端 dist 已在镜像构建阶段复制进去。
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - mindcare_net

volumes:
  mysql_data:
  backend_uploads:

networks:
  mindcare_net:
    driver: bridge
